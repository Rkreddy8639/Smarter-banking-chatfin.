{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}
<div class="form-shell"><h2 class="fw-bold">Welcome back</h2><p class="text-secondary">Sign in to your Chatfin demo account.</p>
<form method="post"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0 small">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
