{% extends "base.html" %}{% block title %}Transfer{% endblock %}{% block content %}
<div class="form-shell"><h2 class="fw-bold">Transfer demo funds</h2><p class="text-secondary">Send simulated funds to another Chatfin account.</p>
<div class="alert alert-info small">Transfers are limited to ₹50,000 per transaction. High-risk demo transfers may be held for review.</div>
<form method="post"><div class="mb-3"><label class="form-label">Recipient account number</label><input class="form-control text-uppercase" name="recipient_account" placeholder="CHATXXXXXXXX" required></div>
<div class="mb-3"><label class="form-label">Amount (INR)</label><input class="form-control" type="number" name="amount" min="0.01" max="50000" step="0.01" required></div>
<div class="mb-3"><label class="form-label">Description</label><input class="form-control" name="description" maxlength="150" value="Demo fund transfer"></div>
<button class="btn btn-primary w-100">Review and transfer</button></form></div>{% endblock %}
