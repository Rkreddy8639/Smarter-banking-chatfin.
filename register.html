{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="form-shell"><h2 class="fw-bold">Create your account</h2><p class="text-secondary">New accounts receive ₹10,000 in simulated demo funds.</p>
<form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" maxlength="100" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password (minimum 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<button class="btn btn-primary w-100">Register</button></form></div>{% endblock %}
